name: Hosted incident investigation
on:
  schedule:
    - cron: '43 10 * * *' # UTC; independent of the pipeline schedule
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roadsafety-operations
  cancel-in-progress: false
jobs:
  investigate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen
      - name: Restore evidence and budget before considering a paid call
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m roadsafety restore-state --data-dir data
      - name: Produce evidence report and optionally a bounded model investigation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m roadsafety investigate --data-dir data --enable-ai
      - name: Preserve reports and conservative budget ledger
        if: always() && steps.restore.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m roadsafety save-operations --data-dir data
      - name: Retain investigation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: investigation-${{ github.run_id }}
          path: data/investigations/
          if-no-files-found: ignore
          retention-days: 7
