name: Publish engineering documentation
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily road safety publication']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: roadsafety-docs
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen
      - name: Restore actual operational evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python -m roadsafety restore-state --data-dir data
          test -f data/warehouse.duckdb
          test -f data/published/manifest.json
      - run: uv run python -m roadsafety toolkit --data-dir data
      - run: uv run python -m roadsafety data-product --data-dir data
      - name: Prepare the generated site
        run: |
          mkdir site
          cp -R data/reports/toolkit/. site/
          cp data/reports/data-product.html site/data-product.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
