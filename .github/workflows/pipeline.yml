name: Daily road safety publication
on:
  schedule:
    - cron: '17 9 * * *' # UTC; daily overlap refresh
    - cron: '37 2 * * 0' # UTC; Sunday full retained-horizon reconciliation
  workflow_dispatch:
    inputs:
      full_reconcile:
        description: Reconcile the complete retained 24-month horizon
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: roadsafety-operations
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen
      - name: Restore complete previous state and reviewed source receipt
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m roadsafety restore-state --data-dir data
      - name: Acquire and validate a candidate
        id: pipeline
        env:
          FULL_RECONCILE: ${{ github.event.schedule == '37 2 * * 0' || inputs.full_reconcile == true }}
        run: |
          if [ "$FULL_RECONCILE" = 'true' ]; then
            uv run python -m roadsafety pipeline --mode live --data-dir data --full-reconcile
          else
            uv run python -m roadsafety pipeline --mode live --data-dir data
          fi
      - name: Publish database then manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m roadsafety publish --data-dir data
      - name: Preserve successful state or failed-run evidence
        if: always() && steps.restore.outcome == 'success' && steps.pipeline.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m roadsafety save-operations --data-dir data
      - name: Retain run diagnostics independently of release publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run-evidence-${{ github.run_id }}
          path: data/runs/
          if-no-files-found: ignore
          retention-days: 7

