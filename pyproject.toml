[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsafety-course"
version = "0.1.0"
description = "An executable data engineering course and public road-safety analytics API"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.4.1",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.11.4",
  "PyYAML==6.0.2",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
roadsafety = "roadsafety.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
